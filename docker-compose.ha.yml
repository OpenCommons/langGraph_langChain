# localAIStack — high-availability overlay (docs/HA_DEPLOYMENT.md)
#
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d --build   # or: make ha-up
#
# What it changes relative to docker-compose.yml:
#   * graph state lives in Postgres (CHECKPOINT_BACKEND=postgres), so any replica
#     can resume any thread and a crashed replica loses nothing already checkpointed
#   * N stateless API replicas (API_REPLICAS, default 3) behind an nginx balancer
#     that re-resolves Docker DNS and retries the next replica on failure
#   * a one-shot db-migrate job owns the schema; replicas never race to migrate
#   * no source bind-mount / --reload: replicas run the image they were built with
# Requires Docker Compose >= 2.24 (`!reset` / `!override` tags).

services:

  db-migrate:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: "no"
    command:
      - python
      - -c
      - "from graphs.checkpoint import setup_persistence; print('db-setup', setup_persistence())"
    environment:
      CHECKPOINT_BACKEND: "postgres"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-localai}:${POSTGRES_PASSWORD:-changeme-local-dev}@postgres:5432/${POSTGRES_DB:-localai}}"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    container_name: !reset null
    ports: !reset []
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    # Replace the base file's `./services/api:/app` live-reload mount.
    volumes: !override
      - ./data/machines:/app/data/machines:ro
      - ./data/health:/app/data/health:ro
      - ./config:/app/config:ro
      - ./volumes/state:/app/state
    deploy:
      replicas: ${API_REPLICAS:-3}
      restart_policy:
        condition: any
    environment:
      CHECKPOINT_BACKEND: "postgres"
      POSTGRES_AUTO_SETUP: "false"
      # Tokens must verify on every replica, so the secret is mandatory here.
      GOVERNANCE_TOKEN_SECRET: "${GOVERNANCE_TOKEN_SECRET:?set GOVERNANCE_TOKEN_SECRET so capability tokens verify on every replica}"
      # Each replica keeps its own provenance chain (a shared file would interleave
      # writers and break the hash links), so do not persist to one path.
      GOVERNANCE_CHAIN_PATH: ""
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: true

  api-lb:
    image: nginx:1.27-alpine
    container_name: localai_api_lb
    restart: unless-stopped
    ports:
      - "4000:80"
    volumes:
      - ./config/nginx-ha.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 3
