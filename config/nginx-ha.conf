# Load balancer for the HA overlay (docker-compose.ha.yml).
# Docker's embedded DNS returns every replica of `api`; resolving per request
# (variable + resolver) lets replicas come and go without restarting nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # SSE (/lc/chat, /lg/agent/stream): do not buffer tokens.
        proxy_buffering off;
        proxy_read_timeout 300s;
        # A replica that is down or resets the connection: try the next one.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
